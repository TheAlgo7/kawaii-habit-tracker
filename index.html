<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kawaii Habit Tracker</title>
    <meta
      name="description"
      content="A gentle, private habit companion where tiny acts of care grow a pocket garden."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta id="app-theme-color" name="theme-color" content="#C96648" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Kawaii Habits" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kawaii Habits" />

    <script>
      (() => {
        const themeColors = {
          'garden-day': '#C96648',
          'garden-night': '#2B2232',
          matcha: '#66785D',
        };
        const legacyThemes = {
          'midnight-sakura': 'garden-night',
          kawaii: 'garden-day',
          sky: 'garden-day',
        };
        let theme = 'garden-day';

        try {
          const stored = JSON.parse(localStorage.getItem('kw_state_v2'));
          const requestedTheme = stored?.preferences?.theme;
          theme = legacyThemes[requestedTheme] || requestedTheme || theme;
        } catch {
          // Keep the calm day theme if storage is unavailable or malformed.
        }

        if (!themeColors[theme]) theme = 'garden-day';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'garden-night' ? 'dark' : 'light';
        document.querySelector('#app-theme-color')?.setAttribute('content', themeColors[theme]);
      })();
    </script>

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const runtimeThemeColors = {
        'garden-day': '#C96648',
        'garden-night': '#2B2232',
        matcha: '#66785D',
      };

      const syncBrowserTheme = () => {
        const theme = document.documentElement.dataset.theme || 'garden-day';
        document.documentElement.style.colorScheme = theme === 'garden-night' ? 'dark' : 'light';
        document
          .querySelector('#app-theme-color')
          ?.setAttribute('content', runtimeThemeColors[theme] || runtimeThemeColors['garden-day']);
      };

      new MutationObserver(syncBrowserTheme).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme'],
      });

      if ('serviceWorker' in navigator) {
        function showUpdateToast(worker) {
          if (document.querySelector('#app-update-notice')) return;

          const bar = document.createElement('aside');
          bar.id = 'app-update-notice';
          bar.className = 'app-update-notice';
          bar.setAttribute('role', 'status');
          bar.setAttribute('aria-live', 'polite');
          bar.innerHTML = `
            <span class="app-update-notice__copy">A fresh version is ready.</span>
            <button class="app-update-notice__action" type="button">Update now</button>
          `;
          bar.querySelector('button').addEventListener('click', () => {
            worker.postMessage({ type: 'SKIP_WAITING' });
            bar.remove();
          });
          document.body.appendChild(bar);
        }

        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            if (reg.waiting && navigator.serviceWorker.controller) showUpdateToast(reg.waiting);
            reg.addEventListener('updatefound', () => {
              const sw = reg.installing;
              if (!sw) return;
              sw.addEventListener('statechange', () => {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateToast(sw);
              });
            });
          } catch {
            // The app remains fully usable when service workers are unavailable.
          }

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
